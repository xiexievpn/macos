name: Build macOS App with PyInstaller

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download sing-box (Universal darwin binary) and rule-sets
        run: |
          SB_VERSION="1.10.7"
          curl -L -o sb-amd64.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-darwin-amd64.tar.gz"
          curl -L -o sb-arm64.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-darwin-arm64.tar.gz"
          tar -xzf sb-amd64.tar.gz
          tar -xzf sb-arm64.tar.gz
          lipo -create \
            "sing-box-${SB_VERSION}-darwin-amd64/sing-box" \
            "sing-box-${SB_VERSION}-darwin-arm64/sing-box" \
            -output sing-box
          chmod +x sing-box
          cp -f sing-box sing-box-universal
          rm -rf sb-amd64.tar.gz sb-arm64.tar.gz "sing-box-${SB_VERSION}-darwin-amd64" "sing-box-${SB_VERSION}-darwin-arm64"

          curl -L -o geoip-cn.srs "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs"
          curl -L -o geosite-cn.srs "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs"
          file sing-box

      - name: Install Python 3.11 Universal2 (x86_64 + arm64) with built-in Tcl/Tk
        run: |
          curl -L -o python-3.11.9-macos11.pkg "https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg"
          sudo installer -pkg python-3.11.9-macos11.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 --version
          file /Library/Frameworks/Python.framework/Versions/3.11/bin/python3

      - name: Build Universal2 (x86_64 + arm64) macOS App with PyInstaller
        run: |
          PY_BIN="/Library/Frameworks/Python.framework/Versions/3.11/bin/python3"
          chmod +x internet.sh close.sh repair_on_login.sh sing-box

          # 1. Build x86_64 app bundle (supports Intel Macs & KVM macOS VM, plus Apple Silicon via Rosetta 2)
          arch -x86_64 "$PY_BIN" -m venv venv_x86
          arch -x86_64 ./venv_x86/bin/pip install --upgrade pip
          arch -x86_64 ./venv_x86/bin/pip install pyinstaller requests pillow pysocks
          arch -x86_64 ./venv_x86/bin/pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --distpath dist_x86 \
            --workpath build_x86 \
            --name "谢谢网络加速器" \
            --icon "favicon.icns" \
            --add-data "favicon.icns:." \
            --add-data "favicon.ico:." \
            --add-data "internet.sh:." \
            --add-data "close.sh:." \
            --add-data "repair_on_login.sh:." \
            --add-data "sing-box:." \
            --add-data "geoip-cn.srs:." \
            --add-data "geosite-cn.srs:." \
            --add-data "languages.json:." \
            --add-data "flags:flags" \
            main_macos.py

          # 2. Build arm64 app bundle (native Apple Silicon M1/M2/M3/M4)
          arch -arm64 "$PY_BIN" -m venv venv_arm64
          arch -arm64 ./venv_arm64/bin/pip install --upgrade pip
          arch -arm64 ./venv_arm64/bin/pip install pyinstaller requests pillow pysocks
          arch -arm64 ./venv_arm64/bin/pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --distpath dist_arm64 \
            --workpath build_arm64 \
            --name "谢谢网络加速器" \
            --icon "favicon.icns" \
            --add-data "favicon.icns:." \
            --add-data "favicon.ico:." \
            --add-data "internet.sh:." \
            --add-data "close.sh:." \
            --add-data "repair_on_login.sh:." \
            --add-data "sing-box:." \
            --add-data "geoip-cn.srs:." \
            --add-data "geosite-cn.srs:." \
            --add-data "languages.json:." \
            --add-data "flags:flags" \
            main_macos.py

          # 3. Merge x86_64 and arm64 app bundles into a Universal2 .app bundle
          mkdir -p dist
          cp -a "dist_x86/谢谢网络加速器.app" "dist/谢谢网络加速器.app"
          "$PY_BIN" - << 'PYEOF'
          import os, subprocess, shutil

          app_dst = "dist/谢谢网络加速器.app"
          app_arm = "dist_arm64/谢谢网络加速器.app"

          for root, dirs, files in os.walk(app_dst):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  if os.path.islink(fpath):
                      continue
                  rel = os.path.relpath(fpath, app_dst)
                  arm_path = os.path.join(app_arm, rel)
                  if not os.path.exists(arm_path) or os.path.islink(arm_path):
                      continue
                  out = subprocess.run(["file", "-b", fpath], capture_output=True, text=True).stdout
                  if "Mach-O" in out and "universal binary" not in out:
                      tmp_fat = fpath + ".fat"
                      res = subprocess.run(["lipo", "-create", fpath, arm_path, "-output", tmp_fat], capture_output=True)
                      if res.returncode == 0:
                          shutil.copymode(fpath, tmp_fat)
                          os.replace(tmp_fat, fpath)
                          print(f"Merged universal2: {rel}")
          PYEOF

          # Ensure sing-box inside the bundle is the fat universal binary
          cp -f sing-box-universal "dist/谢谢网络加速器.app/Contents/Frameworks/sing-box"
          chmod +x "dist/谢谢网络加速器.app/Contents/Frameworks/sing-box"
          file "dist/谢谢网络加速器.app/Contents/MacOS/谢谢网络加速器"
          file "dist/谢谢网络加速器.app/Contents/Frameworks/sing-box"

      - name: Ad-hoc sign and archive macOS App
        run: |
          codesign --force --deep --sign - "dist/谢谢网络加速器.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/谢谢网络加速器.app" "dist/XieXieVPN-mac.zip"
          ls -lh "dist/XieXieVPN-mac.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XieXieVPN-mac
          path: dist/XieXieVPN-mac.zip
          retention-days: 30
